<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>河洛紫微飛星排盤</title>
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="河洛紫微排盤">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=5">
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面：上方輸入列，中間傳統十二宮方盤（中宮放命主資料），右側（窄螢幕在下方）為所選宮位的飛化分析 */
:root {
  /* 單一深色主題：黑底白字，金色為強調色，四化用亮色 */
  --bg: #050608;
  --paper: #0f1114;
  --ink: #f1f2f4;
  --muted: #9aa1ab;
  --line: #2b3038;
  --accent: #d4af5f;
  --accent-soft: #2a2415;
  --lu: #4fd18b;
  --quan: #c08cff;
  --ke: #62a8ff;
  --ji: #ff6b5e;
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
header h1 { font-size: 22px; }
header p { margin: 0; color: var(--muted); }

form#f { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.fld { display: grid; gap: 3px; }
.fld label, .fld .lbl { font-size: 12px; color: var(--muted); }
input, select, button { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
input[type=number] { width: 78px; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); font-weight: 700; padding: 6px 16px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--ink); }
.seg input:checked + label { background: var(--accent); color: var(--paper); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
details.opts { flex-basis: 100%; }
details.opts summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.optgrid { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 8px; }
.err { color: var(--ji); flex-basis: 100%; margin: 0; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .main { grid-template-columns: 1fr; } }
.chartbox { overflow-x: auto; }
.chart { position: relative; display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); grid-template-rows: repeat(4, minmax(150px, auto)); gap: 0; min-width: 640px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cell { border: 0.5px solid var(--line); padding: 6px 7px 50px; position: relative; cursor: pointer; display: flex; flex-direction: column; gap: 2px; transition: background .12s; }
.cell:hover { background: var(--accent-soft); }
.cell.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.cell.target { box-shadow: inset 0 0 0 2px var(--line); }
.stars { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 3px; }
.star { writing-mode: vertical-rl; text-orientation: upright; white-space: nowrap; font-size: 12px; line-height: 1.15; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; }
.star .chip, .star .self { margin: 0; text-orientation: upright; }
.star .chip { padding: 3px 2px; }
.star .chip.o { padding: 2px 1px; }
.star.major { font-size: 15px; font-weight: 700; color: var(--ink); font-family: var(--display); }
.star.fu { color: var(--ink); font-size: 13px; }
.star.sha { color: var(--ink); opacity: .8; }
.star.yi { font-size: 11px; color: var(--muted); }
.stars .gap { width: 4px; }
.chip { display: inline-block; font-size: 11px; line-height: 1; padding: 2px 3px; border-radius: 3px; color: #0b0d10; margin-left: 1px; vertical-align: 2px; font-family: var(--body); font-weight: 700; }
.chip.o { background: transparent; border: 1px solid currentColor; padding: 1px 2px; }
.h-祿 { background: var(--lu); } .h-權 { background: var(--quan); } .h-科 { background: var(--ke); } .h-忌 { background: var(--ji); }
.c-祿 { color: var(--lu); } .c-權 { color: var(--quan); } .c-科 { color: var(--ke); } .c-忌 { color: var(--ji); }
.self { font-size: 11px; font-weight: 700; margin-left: 1px; }
.foot { position: absolute; left: 7px; right: 7px; bottom: 4px; flex-wrap: wrap; display: flex; justify-content: space-between; align-items: end; gap: 4px; font-size: 12px; }
.pname { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--accent); }
.pname .orig { font-family: var(--body); font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 3px; }
.gz { font-family: var(--display); font-weight: 700; font-size: 14px; }
.dx { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
.outs { display: flex; flex-wrap: wrap; gap: 0 6px; font-size: 11.5px; font-weight: 700; margin-top: 2px; }
.outs .lab { color: var(--muted); font-weight: 400; }
.shen12 { font-size: 11px; color: var(--muted); }
.tag.xx { border-color: var(--ji); color: var(--ji); }
.yunsum { display: grid; gap: 4px; margin-top: 8px; font-size: 13px; }
.yunsum b { font-family: var(--display); }
.tags { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; }
.tag { font-size: 10.5px; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; color: var(--muted); }
.tag.shen { border-color: var(--accent); color: var(--accent); }
.tag.lai { border-color: var(--quan); color: var(--quan); }
.tag.yun { border-color: var(--ink); color: var(--ink); }
.center { grid-column: 2 / 4; grid-row: 2 / 4; border: 0.5px solid var(--line); padding: 14px 16px; display: grid; gap: 6px; align-content: start; cursor: default; }
.center h2 { font-size: 18px; }
.center dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
.center dt { color: var(--muted); }
.center dd { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin-top: 4px; }
svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

.side { display: grid; gap: 12px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.panel h3 { font-size: 16px; margin-bottom: 6px; }
.panel p { margin: 4px 0; }
.muted { color: var(--muted); }
.fl { display: grid; grid-template-columns: 46px 1fr; gap: 4px 8px; align-items: baseline; }
.fl .chip { justify-self: start; }
.path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.node { border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; background: var(--bg); }
.arrow { color: var(--ji); font-weight: 700; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
tr.sel td { background: var(--accent-soft); }
tbody tr { cursor: pointer; }
.yun-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.analysis { display: grid; gap: 12px; }
.analysis > header { display: grid; gap: 4px; }
.agrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .agrid { grid-template-columns: 1fr; } }
.asec h3 { font-size: 17px; border-bottom: 2px solid var(--accent); padding-bottom: 4px; margin-bottom: 8px; }
.asec p { margin: 0 0 8px; }
.asec p, .asec li { text-align: justify; text-justify: inter-character; }
.asec ul { margin: 4px 0 0; padding-left: 20px; }
.asec li { margin-bottom: 3px; }
.asec b { color: var(--accent); }
/* 手機版：十二宮方盤縮到螢幕寬度內，不左右捲動 */
@media (max-width: 700px) {
  .wrap { padding: 10px; gap: 10px; }
  header h1 { font-size: 19px; }
  header p { font-size: 12.5px; }
  form#f { padding: 10px; gap: 8px 10px; }
  input[type=number] { width: 64px; }
  input, select, button { font-size: 16px; padding: 5px 6px; }
  .seg label { font-size: 14px; padding: 5px 9px; }
  .chartbox { overflow: visible; }
  .chart { min-width: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, auto); }
  .cell { padding: 4px 3px 3px; gap: 2px; min-width: 0; }
  .stars { gap: 3px 1px; }
  .star { font-size: 10.5px; line-height: 1.1; }
  .star.major { font-size: 13px; }
  .star.fu { font-size: 11px; }
  .star.yi { font-size: 9.5px; }
  .chip { font-size: 8.5px; padding: 2px 1px; }
  .star .chip { padding: 2px 1px; }
  .self { font-size: 9px; }
  .outs { font-size: 9.5px; gap: 0 3px; }
  .tags { gap: 2px; }
  .tag { font-size: 8.5px; padding: 0 2px; }
  .foot { position: static; margin-top: 2px; font-size: 10px; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "s s" "n g" "d d"; gap: 0 2px; align-items: baseline; }
  .foot .shen12 { grid-area: s; } .foot .pname { grid-area: n; } .foot .gz { grid-area: g; } .foot .dx { grid-area: d; }
  .shen12 { font-size: 9px; }
  .pname { font-size: 12px; }
  .pname .orig { display: block; margin: 0; font-size: 9px; }
  .gz { font-size: 11.5px; }
  .dx { font-size: 9px; }
  .center { padding: 8px; gap: 4px; font-size: 11.5px; line-height: 1.4; }
  .center h2 { font-size: 14px; }
  .center dl { grid-template-columns: 1fr; gap: 0; }
  .center dt { font-size: 10px; margin-top: 3px; }
  .legend { font-size: 10px; gap: 3px 8px; }
  .panel { padding: 10px; }
  .yun-ctl .fld { flex: 1 1 40%; }
  .yun-ctl select { width: 100%; }
  table { font-size: 11.5px; }
  th, td { white-space: normal; padding: 4px 3px; word-break: keep-all; }
  .asec h3 { font-size: 16px; }
  .asec p, .asec li { font-size: 13.5px; }
  .fl { grid-template-columns: 34px 1fr; }
}
@media (max-width: 380px) {
  .star.major { font-size: 12px; }
  .outs { font-size: 9px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* 起始載入畫面：黑底、金色細網格與地支環，2 秒後淡出 */
#splash { --sp-bg: #050608; --sp-ink: #e9eef2; --sp-dim: #5b6670; --sp-cyan: #d4af5f; position: fixed; inset: 0; z-index: 9999; background: var(--sp-bg); color: var(--sp-ink); display: grid; place-items: center; overflow: hidden; animation: spOut .6s ease 2s forwards; color-scheme: dark; }
#splash .sp-grid { position: absolute; inset: -1px; background-image: linear-gradient(rgba(212,175,95,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(212,175,95,.06) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(circle at 50% 45%, #000 0, transparent 70%); -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0, transparent 70%); }
#splash .sp-core { position: relative; display: grid; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
#splash .sp-ring { width: min(46vw, 200px); height: auto; margin-bottom: 8px; }
#splash .sp-ticks line { stroke: var(--sp-dim); stroke-width: .8; }
#splash .sp-c1 { fill: none; stroke: rgba(212,175,95,.18); stroke-width: .8; }
#splash .sp-c2 { fill: none; stroke: rgba(233,238,242,.12); stroke-width: 1; }
#splash .sp-arc { fill: none; stroke: var(--sp-cyan); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 352; stroke-dashoffset: 352; transform: rotate(-90deg); transform-origin: 100px 100px; animation: spArc 1.9s cubic-bezier(.6,.1,.3,1) forwards; }
#splash .sp-dot { fill: var(--sp-cyan); animation: spPulse 1s ease-in-out infinite alternate; }
#splash .sp-txt text { fill: var(--sp-dim); font-family: var(--display); font-size: 11px; text-anchor: middle; }
#splash .sp-rot { transform-origin: 100px 100px; animation: spSpin 24s linear infinite; }
#splash .sp-title { margin: 0; font-family: var(--body); font-weight: 700; font-size: clamp(22px, 6.4vw, 40px); letter-spacing: .14em; line-height: 1.25; color: var(--sp-ink); }
#splash .sp-by { margin: -4px 0 4px; font-family: "Noto Serif TC", Georgia, serif; font-style: normal; font-size: clamp(14px, 3.6vw, 18px); letter-spacing: .08em; color: var(--sp-cyan); }
#splash .sp-cw { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--sp-cyan); letter-spacing: .06em; margin-right: .3em; }
#splash .sp-sub { margin: 0; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .32em; color: var(--sp-dim); }
#splash .sp-bar { width: min(64vw, 260px); height: 1px; background: rgba(233,238,242,.12); margin-top: 18px; overflow: hidden; }
#splash .sp-bar i { display: block; height: 100%; width: 100%; background: var(--sp-cyan); box-shadow: 0 0 8px var(--sp-cyan); transform: scaleX(0); transform-origin: left; animation: spBar 1.9s cubic-bezier(.6,.1,.3,1) forwards; }
#splash .sp-load { margin: 0; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .28em; color: var(--sp-dim); }
#splash .sp-dots::after { content: ""; animation: spDots 1.2s steps(4) infinite; }
@keyframes spOut { to { opacity: 0; visibility: hidden; } }
@keyframes spArc { to { stroke-dashoffset: 0; } }
@keyframes spBar { to { transform: scaleX(1); } }
@keyframes spSpin { to { transform: rotate(360deg); } }
@keyframes spPulse { from { opacity: .35; } to { opacity: 1; } }
@keyframes spDots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
@media (prefers-reduced-motion: reduce) {
  #splash .sp-rot, #splash .sp-dot, #splash .sp-dots::after { animation: none; }
  #splash .sp-arc { animation: none; stroke-dashoffset: 0; }
  #splash .sp-bar i { animation: none; transform: scaleX(1); }
  #splash { animation: spOut .01s linear 2s forwards; }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<script>
// 紫微斗數排盤核心（河洛飛星派取向）
// 地支索引：子0 丑1 寅2 卯3 辰4 巳5 午6 未7 申8 酉9 戌10 亥11
// 天干索引：甲0 乙1 丙2 丁3 戊4 己5 庚6 辛7 壬8 癸9
(function (root) {
  const GAN = '甲乙丙丁戊己庚辛壬癸'.split('');
  const ZHI = '子丑寅卯辰巳午未申酉戌亥'.split('');
  const PALACES = ['命宮', '兄弟', '夫妻', '子女', '財帛', '疾厄', '遷移', '交友', '官祿', '田宅', '福德', '父母'];
  const HUA = ['祿', '權', '科', '忌'];
  const m12 = (n) => ((n % 12) + 12) % 12;

  // 四化表，可依門派切換異說
  function siHuaTable(opt = {}) {
    const t = {
      0: ['廉貞', '破軍', '武曲', '太陽'],
      1: ['天機', '天梁', '紫微', '太陰'],
      2: ['天同', '天機', '文昌', '廉貞'],
      3: ['太陰', '天同', '天機', '巨門'],
      4: ['貪狼', '太陰', '右弼', '天機'],
      5: ['武曲', '貪狼', '天梁', '文曲'],
      6: ['太陽', '武曲', '太陰', '天同'],
      7: ['巨門', '太陽', '文曲', '文昌'],
      8: ['天梁', '紫微', '左輔', '武曲'],
      9: ['破軍', '巨門', '太陰', '貪狼'],
    };
    if (opt.wuKe === '太陽') t[4] = ['貪狼', '太陰', '太陽', '天機'];
    if (opt.geng === '陽武同陰') t[6] = ['太陽', '武曲', '天同', '太陰'];
    if (opt.geng === '陽武府同') t[6] = ['太陽', '武曲', '天府', '天同'];
    if (opt.renKe === '天府') t[8] = ['天梁', '紫微', '天府', '武曲'];
    return t;
  }

  // 五虎遁：各宮天干
  function palaceStems(yearGan) {
    const yinStem = (2 * (yearGan % 5) + 2) % 10; // 寅宮天干
    const stems = new Array(12);
    for (let b = 0; b < 12; b++) stems[b] = (yinStem + m12(b - 2)) % 10;
    return stems;
  }

  // 納音五行局
  function wuXingJu(gan, zhi) {
    const g = Math.floor(gan / 2) + 1; // 甲乙1 丙丁2 戊己3 庚辛4 壬癸5
    const z = [0, 0, 1, 1, 2, 2, 0, 0, 1, 1, 2, 2][zhi];
    let v = g + z; if (v > 5) v -= 5;
    return { 1: { name: '金四局', n: 4 }, 2: { name: '水二局', n: 2 }, 3: { name: '火六局', n: 6 }, 4: { name: '土五局', n: 5 }, 5: { name: '木三局', n: 3 } }[v];
  }

  function ziweiPos(ju, day) {
    let x = 0;
    while ((day + x) % ju !== 0) x++;
    const q = (day + x) / ju;
    let pos = 2 + q - 1;
    pos += (x % 2 === 1) ? -x : x;
    return m12(pos);
  }

  // 主函式：輸入農曆資料
  // { yearGan, yearZhi, month(1-12, 已處理閏月), day, hour(時辰索引0-11), gender:'男'|'女', opt }
  function buildChart(inp) {
    const { yearGan, yearZhi, month, day, hour, gender } = inp;
    const opt = inp.opt || {};
    const ming = m12(2 + (month - 1) - hour);
    const shen = m12(2 + (month - 1) + hour);
    const stems = palaceStems(yearGan);
    const ju = wuXingJu(stems[ming], ming);

    const stars = {}; // 星名 -> 地支
    const Z = ziweiPos(ju.n, day);
    Object.assign(stars, { 紫微: Z, 天機: m12(Z - 1), 太陽: m12(Z - 3), 武曲: m12(Z - 4), 天同: m12(Z - 5), 廉貞: m12(Z - 8) });
    const F = m12(4 - Z);
    Object.assign(stars, { 天府: F, 太陰: m12(F + 1), 貪狼: m12(F + 2), 巨門: m12(F + 3), 天相: m12(F + 4), 天梁: m12(F + 5), 七殺: m12(F + 6), 破軍: m12(F + 10) });

    // 輔星與煞星
    stars['左輔'] = m12(4 + month - 1);
    stars['右弼'] = m12(10 - (month - 1));
    stars['文昌'] = m12(10 - hour);
    stars['文曲'] = m12(4 + hour);
    const luCun = [2, 3, 5, 6, 5, 6, 8, 9, 11, 0][yearGan];
    stars['祿存'] = luCun; stars['擎羊'] = m12(luCun + 1); stars['陀羅'] = m12(luCun - 1);
    const kuiYue = { 0: [1, 7], 4: [1, 7], 6: [1, 7], 1: [0, 8], 5: [0, 8], 2: [11, 9], 3: [11, 9], 7: [6, 2], 8: [3, 5], 9: [3, 5] }[yearGan];
    stars['天魁'] = kuiYue[0]; stars['天鉞'] = kuiYue[1];
    stars['地劫'] = m12(11 + hour); stars['地空'] = m12(11 - hour);
    const grp = yearZhi % 4; // 申子辰0 巳酉丑1 寅午戌2 亥卯未3
    const huoStart = [2, 3, 1, 9][grp], lingStart = [10, 10, 3, 10][grp];
    stars['火星'] = m12(huoStart + hour); stars['鈴星'] = m12(lingStart + hour);
    stars['天馬'] = [2, 11, 8, 5][grp];

    // 乙級星
    const yi = {};
    const yz = yearZhi, yg = yearGan, mo = month - 1, h = hour;
    yi['天哭'] = m12(6 - yz); yi['天虛'] = m12(6 + yz);
    yi['龍池'] = m12(4 + yz); yi['鳳閣'] = m12(10 - yz);
    yi['紅鸞'] = m12(3 - yz); yi['天喜'] = m12(9 - yz);
    const season = Math.floor(m12(yz - 2) / 3); // 寅卯辰0 巳午未1 申酉戌2 亥子丑3
    yi['孤辰'] = [5, 8, 11, 2][season]; yi['寡宿'] = [1, 4, 7, 10][season];
    yi['蜚廉'] = [8, 9, 10, 5, 6, 7, 2, 3, 4, 11, 0, 1][yz];
    yi['破碎'] = [5, 1, 9][yz % 3];
    yi['華蓋'] = [4, 1, 10, 7][grp]; yi['咸池'] = [9, 6, 3, 0][grp];
    yi['天德'] = m12(9 + yz); yi['月德'] = m12(5 + yz);
    yi['年解'] = m12(10 - yz);
    yi['天空'] = m12(yz + 1);
    yi['天官'] = [7, 4, 5, 2, 3, 9, 11, 9, 10, 6][yg];
    yi['天福'] = [9, 8, 0, 11, 3, 2, 6, 5, 6, 5][yg];
    yi['天廚'] = [5, 6, 0, 5, 6, 8, 2, 6, 9, 11][yg];
    const jie = [[8, 9], [6, 7], [4, 5], [2, 3], [0, 1]][yg % 5];
    yi['截路'] = jie[0]; yi['空亡'] = jie[1];
    const xun0 = m12(yz - yg + 10);
    yi['旬空'] = (xun0 % 2 === yg % 2) ? xun0 : m12(xun0 + 1);
    yi['天刑'] = m12(9 + mo); yi['天姚'] = m12(1 + mo);
    yi['解神'] = m12(8 + 2 * Math.floor(mo / 2));
    yi['天巫'] = [5, 8, 2, 11][mo % 4];
    yi['天月'] = [10, 5, 4, 2, 7, 3, 11, 7, 2, 6, 10, 2][mo];
    yi['陰煞'] = m12(2 - 2 * mo);
    yi['三台'] = m12(stars['左輔'] + day - 1); yi['八座'] = m12(stars['右弼'] - (day - 1));
    yi['恩光'] = m12(stars['文昌'] + day - 2); yi['天貴'] = m12(stars['文曲'] + day - 2);
    yi['台輔'] = m12(6 + h); yi['封誥'] = m12(2 + h);
    yi['天才'] = m12(ming + yz); yi['天壽'] = m12(shen + yz);
    yi['天傷'] = m12(ming - 7); yi['天使'] = m12(ming - 5);

    const table = siHuaTable(opt);
    const palaceOf = (star) => stars[star];

    // 各宮資料（以地支為鍵）
    const palaces = [];
    for (let b = 0; b < 12; b++) {
      palaces.push({ zhi: b, stem: stems[b], name: PALACES[m12(ming - b)], stars: [], birthHua: {}, isShen: b === shen });
    }
    for (const [s, b] of Object.entries(stars)) palaces[b].stars.push(s);
    for (const p of palaces) p.yiStars = [];
    for (const [s, b] of Object.entries(yi)) palaces[b].yiStars.push(s);

    // 生年四化
    const birthHua = table[yearGan].map((s, i) => ({ star: s, hua: HUA[i], to: palaceOf(s) }));
    birthHua.forEach((h) => { palaces[h.to].birthHua[h.star] = h.hua; });

    // 宮干飛化與自化
    const flights = []; // {from, to, star, hua, self}
    for (let b = 0; b < 12; b++) {
      table[stems[b]].forEach((s, i) => {
        const to = palaceOf(s);
        flights.push({ from: b, to, star: s, hua: HUA[i], self: to === b });
      });
    }
    for (const p of palaces) {
      p.out = flights.filter((f) => f.from === p.zhi);
      p.selfHua = p.out.filter((f) => f.self);
      // 對宮宮干化入本宮（部分門派稱「向心自化」）
      p.oppIn = flights.filter((f) => f.from === m12(p.zhi + 6) && f.to === p.zhi);
    }

    // 大限
    const yang = yearGan % 2 === 0;
    const forward = (yang && gender === '男') || (!yang && gender === '女');
    const daXian = [];
    for (let i = 0; i < 12; i++) {
      const b = m12(ming + (forward ? i : -i));
      daXian.push({ zhi: b, start: ju.n + i * 10, end: ju.n + i * 10 + 9 });
      palaces[b].daXian = [ju.n + i * 10, ju.n + i * 10 + 9];

        let chips = '';
        if (p.birthHua[s]) chips += `<span class="chip h-${p.birthHua[s]}" title="生年化${p.birthHua[s]}">${p.birthHua[s]}</span>`;
        dxHua.filter((h) => h.star === s).forEach((h) => { chips += `<span class="chip o c-${h.hua}" title="大限化${h.hua}">大${h.hua}</span>`; });
        lnHua.filter((h) => h.star === s).forEach((h) => { chips += `<span class="chip o c-${h.hua}" title="流年化${h.hua}">年${h.hua}</span>`; });
        lmHua.filter((h) => h.star === s).forEach((h) => { chips += `<span class="chip o c-${h.hua}" title="流月化${h.hua}">月${h.hua}</span>`; });
        ldHua.filter((h) => h.star === s).forEach((h) => { chips += `<span class="chip o c-${h.hua}" title="流日化${h.hua}">日${h.hua}</span>`; });
        p.selfHua.filter((f) => f.star === s).forEach((f) => { chips += `<span class="self c-${f.hua}" title="自化${f.hua}">↑${f.hua}</span>`; });
        return `<span class="star ${cls}">${s}${chips}</span>`;
      }).join('') + (state.showYi && p.yiStars.length ? '<span class="gap"></span>' + p.yiStars.map((s) => `<span class="star yi">${s}</span>`).join('') : '');
      const tags = [];
      if (p.isShen) tags.push('<span class="tag shen">身宮</span>');
      if (b === c.laiYin) tags.push('<span class="tag lai">來因</span>');
      if (dxName) tags.push(`<span class="tag yun">大${dxName(b)}</span>`);
      if (lnName) tags.push(`<span class="tag yun">年${lnName(b)}</span>`);
      if (lmName) tags.push(`<span class="tag yun">月${lmName(b)}</span>`);
      if (ldName) tags.push(`<span class="tag yun">日${ldName(b)}</span>`);
      if (L.xx === b) tags.push(`<span class="tag xx">小限 ${L.age}歲</span>`);
      const outs = p.out.map((f) => `<span class="c-${f.hua}" title="${GAN[p.stem]}干化${f.star}${f.hua}，${f.self ? '自化' : '入' + nameOf(f.to)}">${f.hua}${f.self ? '↑' : '→' + short(f.to)}</span>`).join('');
      const pn = tjN ? `${tjN[b]}<span class="orig">${p.name}</span>` : p.name;
      html += `<div class="cell${state.sel === b ? ' sel' : ''}" style="grid-row:${r};grid-column:${col}" data-b="${b}" tabindex="0" role="button" aria-label="${p.name} ${GAN[p.stem]}${ZHI[b]}">
        <div class="stars">${starsHtml}</div>
        <div class="outs"><span class="lab">飛</span>${outs}</div>
        <div class="tags">${tags.join('')}</div>
        <div class="foot"><span class="shen12" style="flex-basis:100%">${p.changSheng}・${p.boShi}</span><span class="pname">${pn}</span><span class="dx">${p.daXian[0]}–${p.daXian[1]}</span><span class="gz">${GAN[p.stem]}${ZHI[b]}</span></div>
      </div>`;
    }
    const m = c.meta;
    const bh = c.birthHua.map((h) => `${h.star}<span class="chip h-${h.hua}">${h.hua}</span>`).join('　');
    html += `<div class="center">
      <h2>${m.lunarText}</h2>
      <dl>
        <dt>國曆</dt><dd>${m.solarText}</dd>
        <dt>性別</dt><dd>${c.input.gender}（${c.input.yearGan % 2 === 0 ? '陽' : '陰'}${c.input.gender}，大限${c.forward ? '順行' : '逆行'}）</dd>
        <dt>五行局</dt><dd>${c.ju.name}</dd>
        <dt>命宮／身宮</dt><dd>${GAN[c.stems[c.ming]]}${ZHI[c.ming]}／${GAN[c.stems[c.shen]]}${ZHI[c.shen]}（${c.palaces[c.shen].name}）</dd>
        <dt>來因宮</dt><dd>${GAN[c.stems[c.laiYin]]}${ZHI[c.laiYin]}・${c.palaces[c.laiYin].name}</dd>
        <dt>生年四化</dt><dd>${bh}</dd>
        ${m.monthNote ? `<dt>備註</dt><dd>${m.monthNote}</dd>` : ''}
      </dl>
      <div class="legend"><span><span class="chip h-祿">祿</span>生年四化</span><span><span class="self c-忌">↑忌</span>自化（本宮干化本宮星）</span><span><span class="chip o c-祿">大祿</span>大限／流年四化</span><span><span class="c-忌" style="font-weight:700">忌→父</span> 各宮宮干飛出去向（↑為自化）</span><span>箭頭：所選宮飛出的四化</span><span>宮名上方：長生十二神・博士十二神</span></div>
    </div>`;
    html += '<svg class="arrows" id="arrows" aria-hidden="true"><defs>' + HUA.map((h) => `<marker id="ah-${h}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-${h}"/></marker>`).join('') + '</defs></svg>';
    el.innerHTML = html;
    el.querySelectorAll('.cell').forEach((n) => {
      n.addEventListener('click', () => select(+n.dataset.b));
      n.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(+n.dataset.b); } });
    });
    drawArrows(); renderDetail(); renderTable(); renderYunSum();
  }
  function rank(s) { const i = MAJOR.indexOf(s); if (i >= 0) return i; const j = FU.indexOf(s); return j >= 0 ? 20 + j : 40; }

  function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function drawArrows() {
    const svg = $('arrows'); if (!svg || state.sel === null) return;
    const box = $('chart').getBoundingClientRect();
    const ctr = (b) => { const r = $('chart').querySelector(`.cell[data-b="${b}"]`).getBoundingClientRect(); return [r.left - box.left + r.width / 2, r.top - box.top + r.height / 2]; };
    const colors = { 祿: cssVar('--lu'), 權: cssVar('--quan'), 科: cssVar('--ke'), 忌: cssVar('--ji') };
    svg.querySelectorAll('marker path').forEach((p) => { p.setAttribute('fill', colors[p.getAttribute('class').slice(3)]); });
    const out = state.chart.palaces[state.sel].out;
    const bends = { 祿: -0.18, 權: -0.06, 科: 0.06, 忌: 0.18 };
    let paths = '';
    out.forEach((f) => {
      if (f.self) return;
      const [x1, y1] = ctr(f.from), [x2, y2] = ctr(f.to);
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len;
      const sx = x1 + ux * 28, sy = y1 + uy * 28, ex = x2 - ux * 34, ey = y2 - uy * 34;
      const k = bends[f.hua] * len;
      const cx = (sx + ex) / 2 - uy * k, cy = (sy + ey) / 2 + ux * k;
      paths += `<path d="M${sx},${sy} Q${cx},${cy} ${ex},${ey}" fill="none" stroke="${colors[f.hua]}" stroke-width="${f.hua === '忌' ? 2.6 : 2}" marker-end="url(#ah-${f.hua})" opacity="0.9"/>`;
      const lx = 0.25 * sx + 0.5 * cx + 0.25 * ex, ly = 0.25 * sy + 0.5 * cy + 0.25 * ey;
      paths += `<g><circle cx="${lx}" cy="${ly}" r="9" fill="${colors[f.hua]}"/><text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0d10">${f.hua}</text></g>`;
    });
    svg.insertAdjacentHTML('beforeend', paths);
    $('chart').querySelectorAll('.cell').forEach((n) => n.classList.toggle('target', out.some((f) => f.to === +n.dataset.b && !f.self)));
  }

  function pLabel(b) { const c = state.chart; return `${nameOf(b)}（${GAN[c.stems[b]]}${ZHI[b]}）`; }
  function renderDetail() {
    const c = state.chart, d = $('detail');
    if (state.sel === null) { d.innerHTML = '<h3>宮位飛化</h3><p class="muted">點選命盤上任一宮，這裡會列出該宮宮干的四化去向、從哪些宮化入、自化，以及追忌與祿隨忌走的路徑。</p>'; return; }
    const b = state.sel, p = c.palaces[b];
    const outHtml = p.out.map((f) => `<span class="chip h-${f.hua}">${f.hua}</span><span>${f.star} → ${f.self ? '<b>本宮自化' + f.hua + '</b>' : pLabel(f.to)}</span>`).join('');
    const inc = c.flights.filter((f) => f.to === b && f.from !== b);
    const inHtml = inc.length ? inc.map((f) => `<span class="chip h-${f.hua}">${f.hua}</span><span>${pLabel(f.from)} 化${f.star}入</span>`).join('') : '<span></span><span class="muted">無</span>';
    const selfTxt = p.selfHua.length ? p.selfHua.map((f) => `${f.star}自化${f.hua}`).join('、') : '無';
    const opp = p.oppIn.length ? p.oppIn.map((f) => `${f.star}化${f.hua}`).join('、') : '無';
    const chain = chaseJi(c, b);
    const chainHtml = `<span class="node">${nameOf(b)}</span>` + chain.map((f) => f.self ? `<span class="arrow">↺</span><span class="muted">${f.star}自化忌</span>` : `<span class="arrow">→忌(${f.star})</span><span class="node">${nameOf(f.to)}</span>`).join('');
    const lj = luFollowJi(c, b);
    const ljTxt = `${nameOf(b)}化祿（${lj.lu.star}）入${lj.lu.self ? '本宮' : nameOf(lj.lu.to)}；${nameOf(lj.ji.from)}宮干化忌（${lj.ji.star}）入${lj.ji.self ? '本宮（自化忌）' : nameOf(lj.ji.to)}。`;
    d.innerHTML = `<h3>${pLabel(b)} 飛化</h3>
      <p class="muted">宮干 ${GAN[p.stem]}：${c.table[p.stem].map((s, i) => s + '化' + HUA[i]).join('、')}</p>
      <h3 style="font-size:14px;margin-top:10px">飛出</h3><div class="fl">${outHtml}</div>
      <h3 style="font-size:14px;margin-top:10px">化入本宮</h3><div class="fl">${inHtml}</div>
      <p><b>自化（離心）：</b>${selfTxt}</p>
      <p><b>對宮化入：</b>${opp} <span class="muted" style="font-size:12px">（部分門派稱向心自化）</span></p>
      <h3 style="font-size:14px;margin-top:10px">追忌（忌轉忌）</h3><div class="path">${chainHtml}</div>
      <p class="muted" style="font-size:12px">${chain.end || '已追 12 步'}</p>
      <h3 style="font-size:14px;margin-top:10px">祿隨忌走</h3><p>${ljTxt}</p>`;
  }

  function renderTable() {
    const c = state.chart;
    let h = '<thead><tr><th>宮位</th><th>宮干</th>' + HUA.map((x) => `<th class="c-${x}">化${x}</th>`).join('') + '</tr></thead><tbody>';
    const order = []; for (let i = 0; i < 12; i++) order.push(m12(c.ming - i));
    order.forEach((b) => {
      const p = c.palaces[b];
      h += `<tr data-b="${b}" class="${state.sel === b ? 'sel' : ''}"><td>${nameOf(b)}</td><td>${GAN[p.stem]}${ZHI[b]}</td>` +
        p.out.map((f) => `<td>${f.star}→${f.self ? '<b class="c-' + f.hua + '">★自化</b>' : nameOf(f.to)}</td>`).join('') + '</tr>';
    });
    $('ftable').innerHTML = h + '</tbody>';
    $('ftable').querySelectorAll('tbody tr').forEach((tr) => tr.addEventListener('click', () => { select(+tr.dataset.b); $('chart').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }));
  }

  function fillYunSelects() {
    const c = state.chart;
    $('dxSel').innerHTML = '<option value="-1">不疊</option>' + c.daXian.map((x) => `<option value="${x.zhi}">${x.start}–${x.end}歲・${GAN[c.stems[x.zhi]]}${ZHI[x.zhi]}</option>`).join('');
    const by = c.meta.lunarYear; let opts = '<option value="">不疊</option>';
    for (let y = by; y <= by + 100; y++) { opts += `<option value="${y}">${y}・${GAN[(y - 4) % 10]}${ZHI[m12(y - 4)]}（${y - by + 1}歲）</option>`; }
    $('lnSel').innerHTML = opts;
    $('tjSel').innerHTML = '<option value="">不轉（本命）</option>' + [...Array(12).keys()].map((i) => m12(c.ming - i)).map((b) => `<option value="${b}">以${c.palaces[b].name}為太極</option>`).join('');
    $('dxSel').value = '-1'; $('lnSel').value = ''; $('tjSel').value = '';
    state.dx = -1; state.ln = null; state.lm = null; state.ld = null; state.tj = null; fillMonthDay();
  }
  function layers() {
    const c = state.chart, o = {};
    if (state.ln) {
      o.age = state.ln.y - c.meta.lunarYear + 1; o.xx = o.age >= 1 ? xiaoXianOf(c, o.age) : null;
      if (state.lm) {
        o.lm = { zhi: flowMonthPalace(c, state.ln.zhi, state.lm), gan: flowMonthStem(state.ln.gan, state.lm) };
        if (state.ld) {
          let g = null; try { g = GAN.indexOf(Lunar.fromYmd(state.ln.y, state.lm, state.ld).getDayGan()); } catch (e) {}
          if (g !== null && g >= 0) o.ld = { zhi: flowDayPalace(c, state.ln.zhi, state.lm, state.ld), gan: g };
        }
      }
    }
    return o;
  }
  function huaLine(c, stem) { return stemHua(c, stem).map((h) => `${h.star}<span class="chip h-${h.hua}">${h.hua}</span>`).join(' '); }
  function renderYunSum() {
    const c = state.chart, L = layers(), rows = [];
    if (state.dx >= 0) { const x = c.daXian.find((d) => d.zhi === state.dx); rows.push(`<div><b>大限</b> ${x.start}–${x.end}歲，命在${GAN[c.stems[state.dx]]}${ZHI[state.dx]}（本命${c.palaces[state.dx].name}）：${huaLine(c, c.stems[state.dx])}</div>`); }
    if (state.ln) {
      rows.push(`<div><b>流年</b> ${state.ln.y} ${GAN[state.ln.gan]}${ZHI[state.ln.zhi]}，命在${ZHI[state.ln.zhi]}（本命${c.palaces[state.ln.zhi].name}）：${huaLine(c, state.ln.gan)}</div>`);
      if (L.xx !== null) rows.push(`<div><b>小限</b> ${L.age}歲，在${GAN[c.stems[L.xx]]}${ZHI[L.xx]}（本命${c.palaces[L.xx].name}）</div>`);
    }
    if (L.lm) rows.push(`<div><b>流月</b> ${MONTHS[state.lm - 1]}月 ${GAN[L.lm.gan]}${ZHI[(state.lm + 1) % 12]}，命在${ZHI[L.lm.zhi]}（本命${c.palaces[L.lm.zhi].name}）：${huaLine(c, L.lm.gan)}</div>`);
    if (L.ld) rows.push(`<div><b>流日</b> ${state.ld}日 ${GAN[L.ld.gan]}干，命在${ZHI[L.ld.zhi]}（本命${c.palaces[L.ld.zhi].name}）：${huaLine(c, L.ld.gan)}</div>`);
    $('yunsum').innerHTML = rows.join('');
  }
  function fillMonthDay() {
    const lm = $('lmSel'), ld = $('ldSel');
    lm.disabled = !state.ln;
    lm.innerHTML = '<option value="">不疊</option>' + MONTHS.map((n, i) => `<option value="${i + 1}">${n}月</option>`).join('');
    lm.value = state.lm ? String(state.lm) : '';
    ld.disabled = !(state.ln && state.lm);
    let days = 30;
    if (state.ln && state.lm) { try { days = LunarYear.fromYear(state.ln.y).getMonth(state.lm).getDayCount(); } catch (e) {} }
    if (state.ld && state.ld > days) state.ld = null;
    ld.innerHTML = '<option value="">不疊</option>' + [...Array(days).keys()].map((i) => `<option value="${i + 1}">${i + 1}日</option>`).join('');
    ld.value = state.ld ? String(state.ld) : '';
  }
  $('lmSel').addEventListener('change', (e) => { state.lm = e.target.value ? +e.target.value : null; state.ld = null; fillMonthDay(); render(); });
  $('ldSel').addEventListener('change', (e) => { state.ld = e.target.value ? +e.target.value : null; render(); });
  $('todayBtn').addEventListener('click', () => {
    const t = Solar.fromDate(new Date()).getLunar();
    const y = t.getYear();
    if (!$('lnSel').querySelector(`option[value="${y}"]`)) return;
    state.ln = { y, gan: (y - 4) % 10, zhi: m12(y - 4) }; $('lnSel').value = String(y);
    state.lm = Math.abs(t.getMonth()); state.ld = t.getDay();
    fillMonthDay(); render();
  });
  $('yiChk').addEventListener('change', (e) => { state.showYi = e.target.checked; render(); });
  $('dxSel').addEventListener('change', (e) => { state.dx = +e.target.value; render(); });
  $('lnSel').addEventListener('change', (e) => { const y = +e.target.value; state.ln = e.target.value ? { y, gan: (y - 4) % 10, zhi: m12(y - 4) } : null; if (!state.ln) { state.lm = null; state.ld = null; } fillMonthDay(); render(); });
  $('tjSel').addEventListener('change', (e) => { state.tj = e.target.value === '' ? null : +e.target.value; render(); });

  function renderAnalysis() {
    const c = state.chart;
    let nowYear = new Date().getFullYear();
    try { nowYear = Solar.fromDate(new Date()).getLunar().getYear(); } catch (e) {}
    const secs = ZWA.analyze(c, { birthYear: c.meta.lunarYear, nowYear });
    $('anote').textContent = `依本命盤自動推論，結合南派星性、格局、三方四正與北派宮干四化、化入化出、忌沖；流年以農曆${nowYear}年起算，年齡為虛歲。內容為傳統命理的參考，健康部分不能取代醫療檢查。`;
    $('analysis').innerHTML = secs.map((s, i) => `<article class="asec"><h3>${i + 1}. ${s.title}</h3>${s.items.map((t) => t.includes('<ul>') ? `<div>${t}</div>` : `<p>${t}</p>`).join('')}</article>`).join('');
  }
  function select(b) { state.sel = b; render(); }

  function run(v) {
    const err = $('err');
    try {
      state.chart = compute(v); err.hidden = true;
      state.sel = state.chart.ming;
      fillYunSelects(); render(); renderAnalysis();
      try { localStorage.setItem('zw-input', JSON.stringify(v)); } catch (e) {}
    } catch (e) { err.textContent = e.message || String(e); err.hidden = false; }
  }
  $('f').addEventListener('submit', (e) => { e.preventDefault(); run(readForm()); });
  window.addEventListener('resize', () => { if (state.chart) render(); });
  try { document.fonts.ready.then(() => { if (state.chart) render(); }); } catch (e) {}
  try { let w = 0; new ResizeObserver((es) => { const nw = Math.round(es[0].contentRect.width); if (nw !== w) { w = nw; if (state.chart) requestAnimationFrame(render); } }).observe($('chart')); } catch (e) {}

  let saved = null; try { saved = JSON.parse(localStorage.getItem('zw-input')); } catch (e) {}
  if (saved) writeForm(saved);
  if (typeof Solar === 'undefined') { $('err').textContent = '農曆換算程式庫沒有載入，請重新整理頁面。'; $('err').hidden = false; }
  else run(readForm());
})();
</script>
</body>
</html>
